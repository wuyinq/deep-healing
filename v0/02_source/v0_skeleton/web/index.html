<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepHealing · 幸福小区（V0 垂直切片）</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; height: 100%; background: #f3efe8; color: #3b3630; font-family: system-ui, sans-serif; }
      /* R3 / G1：`#scene` 是 replaced element —— 只写 `inset:0` 时 `right/bottom` 会被忽略，
         画布退回**固有尺寸 300×150**。显式宽高 + `display:block` 才能让它铺满视口。 */
      #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
      /* HUD 只占左上角一块（`max-height` 兜住矮视口），**不得**整块盖住场景。 */
      #hud { position: absolute; left: 16px; top: 16px; max-width: 22rem; max-height: calc(100% - 32px); overflow: auto; padding: 12px 16px; background: rgba(255,255,255,.78); border-radius: 10px; font-size: 13px; line-height: 1.5; z-index: 1; }
      /* N5 / A4 · AC-H-2：**玩家界面根**。必须与 `#hud`（开发观察面板）**分离** ——
         不在 `#hud` 子树内、元素集合交集为空。玩家控件放右下角，不遮挡观察面板。 */
      #player-ui { position: absolute; right: 16px; bottom: 16px; max-width: 24rem; padding: 12px 16px; background: rgba(20,18,16,.82); color: #f3efe8; border-radius: 10px; font-size: 13px; line-height: 1.5; z-index: 2; }
      #player-ui .player-title { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
      @media (max-width: 430px) {
        #player-ui { left: 8px; right: 8px; bottom: 8px; max-width: none; }
      }
      #mode-badge, #reading-badge { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
      #event-stream { max-height: 8rem; overflow: auto; margin: 6px 0 0; padding-left: 1rem; }
      #anomaly-read { white-space: pre-line; margin-top: 8px; opacity: .9; }
      #live-readout { white-space: pre-line; margin-top: 8px; opacity: .9; font-variant-numeric: tabular-nums; }
      #intervention-host { margin-top: 8px; }
      /* N5-C / AC-G G-1：**分发可见面**的署名（CC BY 4.0 义务随分发发生）。
         与 `#hud`（开发观察面板）分离 —— 在玩家界面根 `#player-ui` 内。 */
      #credits { margin-top: 8px; padding-top: 6px; border-top: 1px solid rgba(243,239,232,.2);
                 font-size: 11px; line-height: 1.45; opacity: .92; }
      #credits .credits-title { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
      #credits .credits-attribution { display: block; overflow-wrap: anywhere; }
      /* M5.2 r2 · 因果追溯：只读文本块。长 ref / 哈希 / 信号串**必须**能在窄屏断行，
         否则 `scrollWidth > clientWidth`（横向溢出）。 */
      #causal-trace { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(0,0,0,.12); font-size: 12px; opacity: .95; }
      #hud { overflow-wrap: anywhere; }
      @media (max-width: 430px) {
        #hud { left: 8px; right: 8px; top: 8px; max-width: none; font-size: 12px; }
        #event-stream { max-height: 4rem; }
        #causal-trace { font-size: 11px; }
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud">
      <div id="mode-badge">observe</div>
      <div id="reading-badge">surface</div>
      <div id="tick">tick 0</div>
      <!-- M5.2 r2 · 因果追溯（事件 → 记忆 → 决策 → 可观察行动）；只读文本，无控件 -->
      <div id="causal-trace">causal trace: waiting for events</div>
      <div id="controls">
        <button id="toggle-reading" type="button">切换读法</button>
        <button id="toggle-mode" type="button">切换模式</button>
      </div>
    </div>
    <!-- N5 / A4（AC-H-2）：**玩家界面根**。必须在 `#hud` **之外** —— 玩家界面与开发观察面板分离。 -->
    <div id="player-ui">
      <div class="player-title">玩家</div>
      <div id="intervention-host"></div>
      <!-- N5-C / AC-G G-1：分发可见面的署名容器（内容由 credits.ts 挂载；见 `web/src/ui/player/credits.ts`）。 -->
      <div id="credits" role="contentinfo" aria-label="素材署名"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
